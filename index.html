<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frontline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#2c3124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frontline">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body>
<!--APP-->
<div class="app" id="tac-app">
  <header class="bar">
    <div class="brand">
      <span class="brand-name">Frontline</span>
      <span class="brand-sub">Front de l'Est · 1943</span>
    </div>
    <div class="status">
      <span id="battle-name" class="battle-name"></span>
      <span id="turn" class="turn"></span>
      <span id="cond" class="cond"></span>
      <span id="phase" class="phase"></span>
      <span id="objective" class="objective" hidden></span>
    </div>
    <div class="bar-actions">
      <button class="btn btn-ghost btn-icon" id="btn-help" aria-label="Règles">?</button>
      <button class="btn btn-ghost" id="btn-menu">Menu</button>
    </div>
  </header>
  <main class="desk">
    <section class="board" aria-label="Carte du champ de bataille">
      <canvas id="map"></canvas>
      <canvas id="weather" aria-hidden="true"></canvas>
      <div class="map-tools">
        <button class="tool" id="zoom-in" aria-label="Zoomer">+</button>
        <button class="tool" id="zoom-out" aria-label="Dézoomer">−</button>
        <button class="tool" id="zoom-fit" aria-label="Voir toute la carte"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <button class="tool" id="grid-toggle" aria-label="Afficher la grille" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l6.5 3.75v7.5L10 17l-6.5-3.75v-7.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
        <button class="tool sound-toggle" id="sound-toggle" aria-label="Couper le son" aria-pressed="true" title="Son (M)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4.5-4v13l-4.5-4H3z" fill="currentColor"/><path class="snd-on" d="M13.5 7a4 4 0 010 6M15.5 4.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="snd-off" d="M13.5 7.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="tool" id="cmd-toggle" aria-label="Mode directives" aria-pressed="false" title="Mode directives (D)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 18V2.5M5 3h10l-2.5 3.5L15 10H5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="directive-bar" id="directive-bar" hidden>
        <span class="directive-title">Directives</span>
        <button class="dtool" data-dir="attack" aria-pressed="false">Attaquer</button>
        <button class="dtool" data-dir="defend" aria-pressed="false">Défendre</button>
        <button class="dtool" data-dir="retreat" aria-pressed="false">Repli</button>
        <button class="dtool dtool-x" id="dir-clear" aria-label="Effacer les directives"><span class="lbl-long">Effacer</span><span class="lbl-short" aria-hidden="true">✕</span></button>
        <button class="dtool dtool-x" id="dir-off" aria-label="Reprendre le contrôle direct">Contrôle direct</button>
      </div>
      <div class="directive-bar fire-bar" id="fire-bar" hidden>
        <span class="directive-title">Feux</span>
        <button class="dtool" data-call="barrage" aria-pressed="false" title="Barrage focalisé : l'hexagone et ses voisins, amis compris ; les maisons s'effondrent">Barrage <span class="call-n"></span></button>
        <button class="dtool" data-call="support" aria-pressed="false" title="Tir d'appui sur une case que vous voyez">Appui <span class="call-n"></span></button>
      </div>
      <p class="hint" id="hint" hidden></p>
    </section>
    <aside class="side">
      <nav class="tabs" role="tablist" aria-label="Panneaux">
        <button class="tab" role="tab" data-tab="unit">Unité</button>
        <button class="tab" role="tab" data-tab="army">Troupes</button>
        <button class="tab" role="tab" data-tab="log">Journal</button>
      </nav>
      <div class="panels">
        <section class="panel" id="unit-card" data-panel="unit" aria-live="polite"></section>
        <section class="panel" data-panel="army">
          <h2 class="panel-title">Ordre de bataille</h2>
          <div id="army"></div>
        </section>
        <section class="panel panel-log" data-panel="log">
          <h2 class="panel-title">Journal des opérations</h2>
          <ul class="log" id="log"></ul>
        </section>
      </div>
      <div class="dock">
        <button class="btn btn-primary btn-go" id="btn-go">Exécuter le tour</button>
      </div>
    </aside>
  </main>
</div>
<div class="app front-app" id="front-app" hidden>
  <header class="bar">
    <div class="brand">
      <span class="brand-name">Frontline</span>
      <span class="brand-sub">Front stratégique</span>
    </div>
    <div class="status">
      <span id="f-name" class="battle-name"></span>
      <span id="f-day" class="turn"></span>
      <span id="f-cond" class="cond"></span>
      <span id="f-phase" class="phase"></span>
      <span id="f-goal" class="objective"></span>
    </div>
    <div class="bar-actions">
      <button class="btn btn-ghost btn-icon" id="f-help" aria-label="Règles">?</button>
      <button class="btn btn-ghost" id="f-menu">Menu</button>
    </div>
  </header>
  <main class="desk">
    <section class="board" aria-label="Carte du front">
      <canvas id="f-map" class="map-canvas"></canvas>
      <canvas id="f-weather" class="weather-canvas" aria-hidden="true"></canvas>
      <div class="order-rails" id="f-tools" role="toolbar" aria-label="Ordres du matin" aria-orientation="vertical">
        <div class="order-rail rail-l">
          <div class="tool-group" role="group" aria-label="Manœuvre" title="Manœuvre">
            <button class="otool" data-tool="infantry" aria-pressed="false" title="Infanterie (1)" aria-label="Infanterie (1)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 6l18 12M21 6L3 18"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="armor" aria-pressed="false" title="Blindés (2)" aria-label="Blindés (2)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1"/><rect x="6.5" y="9.5" width="11" height="5" rx="2.5"/></svg><span class="tool-n"></span><span class="tool-f"></span></button>
            <button class="otool" data-tool="fix" aria-pressed="false" title="Fixer (7)" aria-label="Fixer (7)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h10M9.5 8l4 4-4 4M17 5v14M20.5 5v14"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="retreat" aria-pressed="false" title="Repli (3)" aria-label="Repli (3)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 18v-6a4 4 0 0 0-4-4H5"/><path d="M9 4L5 8l4 4"/></svg><span class="tool-n"></span></button>
          </div>
          <div class="tool-group" role="group" aria-label="Renforts" title="Renforts">
            <button class="otool" data-tool="reserve" aria-pressed="false" title="Réserves (6)" aria-label="Réserves (6)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l7-6 7 6M5 12l7-6 7 6"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="priority" aria-pressed="false" title="Priorité (8)" aria-label="Priorité (8)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 21.5V2.5"/><path d="M6.5 3.5l12 4.5-12 4.5"/><path d="M3.5 21.5h6"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="drop" aria-pressed="false" title="Parachutistes (L)" aria-label="Parachutistes (L)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 6.5 0 0 1 18 0z"/><path d="M3 10l7.6 8M21 10l-7.6 8M12 10v8"/><circle cx="12" cy="20" r="1.6"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="pontoon" aria-pressed="false" title="Pont de bateaux (G)" aria-label="Pont de bateaux (G)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9h20M5 9v6M12 9v6M19 9v6"/><path d="M2 19c2-1.4 4-1.4 6 0s4 1.4 6 0 4-1.4 6 0"/></svg><span class="tool-n"></span></button>
          </div>
        </div>
        <div class="order-rail rail-r">
          <div class="tool-group" role="group" aria-label="Feux" title="Feux">
            <button class="otool" data-tool="barrage" aria-pressed="false" title="Barrage (5)" aria-label="Barrage (5)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M5.3 18.7l2.8-2.8M15.9 8.1l2.8-2.8"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="salvo" aria-pressed="false" title="Salve de lance-roquettes (R)" aria-label="Salve de lance-roquettes (R)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l8-8M7 17l8-8M11 21l8-8"/><path d="M8 5h3v3M12 9h3v3M16 13h3v3"/></svg><span class="tool-n"></span></button>
            <button class="otool" data-tool="air" aria-pressed="false" title="Aviation (9)" aria-label="Aviation (9)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.9 0 1.3 1 1.3 2.5v4l7.7 3.5v2l-7.7-2v4.5l2.5 2v1.5L12 19.5l-3.8 1V19l2.5-2v-4.5L3 14.5v-2L10.7 9V5c0-1.5.4-2.5 1.3-2.5z"/></svg><span class="tool-n"></span></button>
          </div>
        </div>
      </div>
      <div class="street-ring" id="f-street-ring" hidden></div>
      <div class="street-pop" id="f-street" role="dialog" aria-labelledby="f-street-title" hidden></div>
      <div class="deploy-bar" id="f-deploy" hidden>
        <span class="deploy-title">Déploiement</span>
        <div class="deploy-list" id="f-deploy-list"></div>
        <button class="btn btn-primary btn-sm" id="f-deploy-done">Terminer</button>
      </div>
      <p class="hint" id="f-hint" hidden></p>
    </section>
    <aside class="side f-side" id="f-side">
      <div class="rail">
        <button class="tool rail-toggle" id="f-collapse" aria-expanded="true" aria-controls="f-side" aria-label="Réduire le panneau" title="Réduire le panneau (P)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <nav class="tabs" role="tablist" aria-label="Panneaux">
          <button class="tab" role="tab" data-ftab="orders" id="f-tab-orders">Ordres</button>
          <button class="tab" role="tab" data-ftab="forces">Forces</button>
          <button class="tab" role="tab" data-ftab="log">Journal</button>
        </nav>
        <button class="tool" id="f-zoom-fit" aria-label="Voir toute la carte" title="Voir toute la carte (0)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        <button class="tool sound-toggle" id="f-sound" aria-label="Couper le son" aria-pressed="true" title="Son (M)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4.5-4v13l-4.5-4H3z" fill="currentColor"/><path class="snd-on" d="M13.5 7a4 4 0 010 6M15.5 4.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="snd-off" d="M13.5 7.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
      <div class="panels">
        <section class="panel" id="f-orders" data-fpanel="orders" aria-live="polite"></section>
        <section class="panel" id="f-forces" data-fpanel="forces"></section>
        <section class="panel panel-log" data-fpanel="log">
          <h2 class="panel-title">Journal du front</h2>
          <ul class="log" id="f-log"></ul>
        </section>
      </div>
      <div class="dock">
        <button class="btn btn-primary btn-go" id="f-go" title="Lancer la journée (Entrée)"><svg class="go-i" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg><span class="go-l" id="f-go-label">Lancer la journée</span></button>
        <div class="day-clock" id="f-clock" hidden>
          <span class="clock-time" id="f-clock-time"></span>
          <span class="clock-track" id="f-clock-track"><i></i></span>
          <button class="clock-skip" id="f-skip" title="Passer la journée (Entrée)" aria-label="Passer la journée"><span class="skip-l">Passer</span> <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4l7 6-7 6zM10 4l7 6-7 6z" fill="currentColor"/></svg></button>
        </div>
      </div>
    </aside>
  </main>
</div>
<div class="overlay" id="overlay" hidden>
  <article class="dossier" id="dossier"></article>
</div>
<!--/APP-->
<script type="module" src="src/main.js"></script>
</body>
</html>
